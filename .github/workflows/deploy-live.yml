# Deploy live build to FTP (https://testv3.websitedemolynk.com/pos/)
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   Servers are listed in the job matrix below (deployed in parallel, same creds).
#   FTP_USERNAME    → pos@testv3.websitedemolynk.com
#   FTP_PASSWORD    → (your FTP password — never commit this)
# Optional:
#   FTP_SERVER_DIR  → remote folder (default / — FTP user root is usually /pos docroot)

name: Deploy live (FTP)

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-live-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - 203.161.41.148
          - 192.249.118.80

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build for live
        run: npm run build:live

      - name: Deploy dist to FTP (${{ matrix.server }})
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ matrix.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

            