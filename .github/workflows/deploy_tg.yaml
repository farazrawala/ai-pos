# Deploy live build to FTP (https://pos.tgcrm.net/)
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   FTP_TG_SERVER    → FTP host for pos.tgcrm.net
#   FTP_TG_USERNAME  → FTP user for pos.tgcrm.net
#   FTP_TG_PASSWORD  → (your FTP password — never commit this)
# Optional:
#   FTP_TG_SERVER_DIR → remote folder (default / — FTP user root is the site docroot)

name: Deploy TG live (FTP)

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-tgcrm-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build for pos.tgcrm.net
        run: npm run build:tgcrm

      - name: Deploy dist to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_TG_SERVER }}
          username: ${{ secrets.FTP_TG_USERNAME }}
          password: ${{ secrets.FTP_TG_PASSWORD }}
          local-dir: ./dist/
          server-dir: /pos/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
